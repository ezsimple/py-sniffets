server {

    root /var/www/html;

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.nginx-debian.html;

    server_name a1.mkeasy.kro.kr;
		access_log /var/log/nginx/a1.mkeasy.kro.kr-access.log custom;

		location /robots.txt {
        alias /home/ubuntu/py-sniffets/robots.txt;
    }

		# grafana monitoring
		# location /grafana/ {
		# 	proxy_pass http://localhost:3000/grafana/;
		# 	proxy_set_header Host $host;
		# 	proxy_set_header X-Real-IP $remote_addr;
		# 	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# 	proxy_set_header X-Forwarded-Proto $scheme;
		# 	allow 116.34.248.173;
		# }

		# ----------------------------------------------------------------------
		# 모니터링 
		# ----------------------------------------------------------------------

		# ----------------------------------------------------------------------
		# /metrics 로 쓸데없이 트레픽이 많아서 서비스를 중단합니다.
		# ----------------------------------------------------------------------
		# 모니터링 by prometheus
		location /metrics {
			  deny all; # 모든 IP 차단
		}
		# ----------------------------------------------------------------------
		
		# location /awstats {
		# 	gzip off;
		# 	root /usr/lib/cgi-bin/;
		# 	include fastcgi_params;
		# 	fastcgi_pass unix:/var/run/fcgiwrap.socket;  # fcgiwrap 소켓
		# 	fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/awstats.pl;
		# 	allow 116.34.248.173;
		# }
		# location /awstats-icon/ {
		# 	alias /usr/share/awstats/icon/;  # 아이콘 파일 경로
		# 	access_log off;
		# 	expires max;
		# 	allow 116.34.248.173;
		# }


		# ----------------------------------------------------------------------
		# 개인 프로필 & 스킬트리
		# ----------------------------------------------------------------------
    location / {
				location /static/ {
						alias /home/ubuntu/py-sniffets/toy-project/static/; # 실제 static 파일 경로로 수정
				}
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
        include uwsgi_params;
        uwsgi_pass unix:/tmp/toy-project.sock;  # uWSGI 소켓 경로
				try_files $uri @uwsgi;  # 요청된 URI가 없으면 uwsgi로 전달
    }
		location @uwsgi {
        include uwsgi_params;
        uwsgi_pass unix:/tmp/toy-project.sock;  # uWSGI 소켓 경로
    }

		# ----------------------------------------------------------------------
		# 불량업체정보, IT노조 정보
		# ----------------------------------------------------------------------
		location /bad/ {
        proxy_pass http://localhost:3100/;  # 마지막 슬래시(/) 주의
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

		# ----------------------------------------------------------------------
		# react-erp frontend 구조 설계
		# ----------------------------------------------------------------------
		location /erp {
				alias /home/ubuntu/work/react-erp/dist;  # 빌드 결과 경로
				try_files $uri $uri/ /erp/index.html;  # SPA를 위한 설정
		}

		# ----------------------------------------------------------------------
		# cancerline-mobile front/bff 구조 설계
		# ----------------------------------------------------------------------
		set $mac_book 116.34.248.173;
		set $front_port 5173;
		set $bff_port 3123;
		location /magazine { # front
				proxy_pass http://$mac_book:$front_port;  # Nest.js 애플리케이션이 실행되는 포트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

				# alias /home/ubuntu/work/nodejs/cancerline-mobile/front/dist;  # 빌드 결과 경로
				# try_files $uri $uri/ /magazine/index.html;  # SPA를 위한 설정

				# 캐시 방지 헤더 추가
				add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
				add_header Pragma "no-cache";
				add_header Expires "0";
				add_header 'Access-Control-Allow-Origin' '*';
				add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';

				# 백엔드 연결 시간 설정
				proxy_connect_timeout 60s;
				proxy_send_timeout 60s;
				proxy_read_timeout 60s;
				send_timeout 60s;
		}

		# 허용 도메인 화이트리스트 설정 nginx.conf 파일 참조
		location /cl-api/ { # bff
				proxy_pass http://$mac_book:$bff_port/cl-api/;  # Nest.js 애플리케이션이 실행되는 포트, 주의 경로끝에 / 추가
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

				# CORS 설정 추가
				# add_header 'Access-Control-Allow-Origin' $cors_origin always;
				add_header 'Access-Control-Allow-Origin' '*';
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
				add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
				add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

				# 캐시 방지 헤더
				add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
				add_header Pragma "no-cache";
				add_header Expires "0";
		}

		# ----------------------------------------------------------------------
		# /hr_list 리쿠르팅 통계 챠트
		# ----------------------------------------------------------------------
		location /hr {
				location /hr/static/ {
						alias /home/ubuntu/oc/hr-server/app/static/; # 실제 static 파일 경로로 수정
				}
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
        include uwsgi_params;
        uwsgi_pass unix:/tmp/hr-server.sock;  # uWSGI 소켓 경로
        uwsgi_param SCRIPT_NAME /hr;  # SCRIPT_NAME 설정
    }

		# ----------------------------------------------------------------------
		# 명언 clone API
		# ----------------------------------------------------------------------
    location /quotes {
        proxy_pass http://localhost:3355/quotes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
    }

		# ----------------------------------------------------------------------
		# 명언&번역 챗봇서비스
		# ----------------------------------------------------------------------
    location /chat/ws {  # WebSocket 경로
        proxy_pass http://localhost:4444/chat/ws;  # WebSocket 서버의 URL
        # WebSocket 관련 헤더 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
    }
    location /chat/ {
				location /chat/static/ {
						alias /home/ubuntu/py-sniffets/chat/v1/static/;  # 실제 static 파일 경로로 수정
				}
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
        proxy_pass http://localhost:4444/chat/;  # FastAPI의 /api 경로로 전달
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 추가: 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
    }

		# ----------------------------------------------------------------------
		# 과거날씨
		# ----------------------------------------------------------------------
    location /past-weather/ {
				location /past-weather/static/ {
						alias /home/ubuntu/py-sniffets/past-weather/static/;  # 실제 static 파일 경로로 수정
				}
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
        proxy_pass http://localhost:3366/past-weather/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 추가: 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
    }

		# ----------------------------------------------------------------------
		# FastAPI를 이용한 단순 파일 다운로드 서버
		# ----------------------------------------------------------------------
    location /v1/ {
				location /v1/static/ {
						alias /home/ubuntu/py-sniffets/http_auth/v5/static/;  # 실제 static 파일 경로로 수정
				}
				limit_req zone=one burst=10 nodelay;  # 순간 최대 10개 요청 허용
        proxy_pass http://localhost:3333/v1/;  # FastAPI의 /api 경로로 전달
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 추가: 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
    }

		# ----------------------------------------------------------------------
		# FastAPI를 이용한 langChain + RAG service
		# ----------------------------------------------------------------------
    location /rag1/ {
				limit_req zone=one burst=4 nodelay;  # 순간 최대 4개 요청 허용
        proxy_pass http://localhost:8100/rag1/;  # FastAPI의 context_path 경로
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 추가: 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
    }

		# ----------------------------------------------------------------------
		# FastAPI를 이용한 elasticsearch + langChain + huggingface + RAG service
		# ----------------------------------------------------------------------
    location /rag2/ {
				limit_req zone=one burst=4 nodelay;  # 순간 최대 4개 요청 허용
        proxy_pass http://localhost:8200/rag2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 추가: 프로토콜 설정
        proxy_cache_bypass $http_upgrade;
    }

		# ----------------------------------------------------------------------
    # keycloak 서버 reverse proxy 연결
		# ----------------------------------------------------------------------
    location /auth {
        proxy_pass http://localhost:18080/auth; # Keycloak이 실행 중인 호스트 및 포트로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keycloak에서 처리할 수 있는 요청만 허용
        proxy_set_header X-Forwarded-Uri $uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_request_buffering off;
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
    }

		# ----------------------------------------------------------------------
		# 달력 한장
		# ----------------------------------------------------------------------
    location /holiday {
        proxy_pass http://localhost:3002/holiday; # Keycloak이 실행 중인 호스트 및 포트로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
				limit_req zone=one burst=10 nodelay;  # 순간 최대 5개 요청 허용
    }
    location /calendar {
				alias /home/ubuntu/work/nodejs/nest-calendar/v2/frontend/dist;  # 빌드 결과 경로
				try_files $uri $uri/ /calendar/index.html;  # SPA를 위한 설정
    }

		# ----------------------------------------------------------------------
		# 유튜브 채널 검색
		# streamlit.app 에서 주소줄을 강제로 변환 시킴 (인증처리를 통해)
		# ----------------------------------------------------------------------
		location /tube {
				# 기본 프록시 설정(주의: 맨끝에 슬래시가 필요)
				proxy_pass https://autosummaryforyoutube-a2lunan9appkswingy7zuip.streamlit.app/;
				proxy_set_header Host autosummaryforyoutube-a2lunan9appkswingy7zuip.streamlit.app;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /kibana/ {
				proxy_pass http://127.0.0.1:5601/kibana/;

				proxy_http_version 1.1;
				proxy_set_header Upgrade $http_upgrade;
				proxy_set_header Connection "upgrade";

				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto https;

				add_header Strict-Transport-Security "max-age=86400" always;

				proxy_read_timeout 300;
		}

    # pdf 강의파일 보여주기
    # location.href=kakaotalk://web/openExternal?url=https://a1.mkeasy.kro.kr/lecture/python
    # 카카오톡 인앱브라우저에서 외부브라우저 호출하기 : https://burndogfather.com/271
    # location /lecture/python {
		#	alias /var/www/html/yoon.html;
    #	default_type text/html;
		#	limit_req zone=one burst=5 nodelay;  # 순간 최대 5개 요청 허용
    #	try_files $uri =404;
    # }

    # location /lecture/python_for_yoon {
    #    alias /home/ubuntu/dl/무지_이쁜_유니를_위한_초간단_파이썬_강의.pdf;
    #    default_type application/pdf;
		#		limit_req zone=one burst=5 nodelay;  # 순간 최대 5개 요청 허용
    #    # add_header Content-Disposition 'inline; filename="무지_이쁜_유니를_위한_초간단_파이썬_강의.pdf"';
    # }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/a1.mkeasy.kro.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/a1.mkeasy.kro.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
   if ($host = a1.mkeasy.kro.kr) {
       return 301 https://$host$request_uri;
   } # managed by Certbot


   listen 80 default_server;
   listen [::]:80 default_server;

   server_name a1.mkeasy.kro.kr;
   return 404; # managed by Certbot

}
